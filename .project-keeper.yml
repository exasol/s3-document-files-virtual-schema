sources:
  - type: maven
    path: pom.xml
    modules:
      - integration_tests
      - jar_artifact
      - udf_coverage
version:
  fromSource: pom.xml
build:
  runnerOs: ubuntu-24.04
  freeDiskSpace: true
  exasolDbVersions:
    - "2026.1.0"
    - "2025.1.13"
  workflows:
    - name: ci-build.yml
      stepCustomizations:
        - action: INSERT_AFTER
          job: matrix-build
          stepId: enable-testcontainer-reuse
          content:
            name: Create test_config.properties
            id: create-test-config
            run: |
              echo "owner = ${{ secrets.AWS_TAG_OWNER }}" > test_config.properties
              echo "s3CacheBucket = persistent-s3-vs-test-file-cache" >> test_config.properties

        - action: REPLACE
          stepId: build-pk-verify
          job: matrix-build
          content:
            name: Run tests and build with Maven
            id: build-pk-verify
            run: mvn --batch-mode clean verify -DossindexSkip=true -Dcom.exasol.dockerdb.image=${{ matrix.exasol_db_version }}
            env:
              AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
              AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              AWS_REGION: "eu-central-1"

        - action: INSERT_AFTER
          job: matrix-build
          stepId: enable-testcontainer-reuse
          content:
            name: Fix VM Crash in UDFs
            id: fix-vm-crash
            run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
